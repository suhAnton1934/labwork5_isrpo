name: UnitTests

on: [push]

jobs:
    test:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
            fail-fast: false 
        runs-on: ${{matrix.os}}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install pytest
                
            - name: Run unit tests
              run: |
                python -m pytest tests/ -v

        